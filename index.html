<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Buchstaben">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F4F6FF">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Buchstaben</title>
<style>
/* Farbwelt: Blau (Hauptfarbe, in Stufen), Amber (Akzent), Türkis (richtig/geschafft) */
:root{
  --ink:#0B1B4D; --muted:#4B5A8C;
  --paper:#F4F6FF; --grid:#E5EAFB;
  --b600:#2653E0; --b700:#1B3DB0; --b900:#16296F; --b950:#0A1648;
  --b300:#9FB5FF; --b200:#C9D5FF; --b100:#E4EAFF;
  --a500:#FFB400; --a600:#CC8F00;
  --t600:#0F8F87; --t700:#0A6B65;
  --r:10px; --r2:14px;
  --font:"Avenir Next","SF Pro Display",-apple-system,system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background-color:var(--paper);color:var(--ink);font-family:var(--font);font-weight:700;letter-spacing:-.01em}
/* Häuschenpapier wie im Schweizer Schulheft */
body{min-height:100dvh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
input,textarea{-webkit-user-select:text;user-select:text}
button{font-family:inherit}
[hidden]{display:none!important}
.screen{max-width:520px;margin:0 auto;padding:14px 16px 28px}

/* Bausteine: flache Klötze mit scharfer Kante */
.blk{border:0;border-radius:var(--r);background:var(--bg);color:var(--fg);box-shadow:0 5px 0 var(--shade);
  font-weight:800;transition:transform .08s,box-shadow .08s;cursor:pointer}
.blk:active{transform:translateY(4px);box-shadow:0 1px 0 var(--shade)}
.c0{--bg:var(--b600);--shade:var(--b700);--fg:#fff}
.c1{--bg:var(--b900);--shade:var(--b950);--fg:#fff}
.c2{--bg:var(--a500);--shade:var(--a600);--fg:var(--ink)}
.c3{--bg:var(--t600);--shade:var(--t700);--fg:#fff}
.c4{--bg:#fff;--shade:var(--b200);--fg:var(--ink)}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

/* Kopfzeile */
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.top .grow{flex:1;min-width:0}
.top h1{margin:0;font-size:26px;line-height:1.1;letter-spacing:-.02em}
.top small{display:block;color:var(--muted);font-size:15px;margin-top:2px}
.sq{width:52px;height:52px;font-size:24px;flex:none;display:grid;place-items:center;border-radius:var(--r)}
.stars{background:#fff;border:2px solid var(--b200);border-radius:10px;height:46px;padding:0 14px;display:flex;align-items:center;font-size:20px;white-space:nowrap;flex:none}
.gear{width:46px;height:46px;flex:none;display:grid;place-items:center;padding:0;background:#fff;border:2px solid var(--b200);border-radius:10px;color:var(--muted);cursor:pointer}
.gear:active{background:var(--b100)}
.top.home{margin-bottom:18px;gap:10px}
.appicon{width:60px;height:60px;border-radius:14px;box-shadow:0 3px 0 var(--b200);flex:none;display:block}

/* Start */
.menu{display:flex;flex-direction:column;gap:14px}
.big{display:flex;align-items:center;gap:16px;width:100%;min-height:92px;padding:10px 14px;text-align:left;font-size:24px;border-radius:var(--r2);letter-spacing:-.02em}
.big .ic{width:58px;height:58px;display:grid;place-items:center;font-size:32px;line-height:1;flex:none;background:rgba(255,255,255,.2);border-radius:8px}
.big.c2 .ic{background:rgba(255,255,255,.38)}
.big span:last-child{line-height:1.15}

/* Buchstabenraster */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tile{position:relative;aspect-ratio:1/1;font-size:clamp(36px,12vw,60px);display:grid;place-items:center;padding:0;border-radius:8px}
.tile .bd svg,.stk .se svg{width:1em;height:1em;display:block}
.tile .bd{position:absolute;right:4px;bottom:4px;font-size:15px;line-height:1;background:#fff;border-radius:4px;padding:3px}

/* Spiel */
.game{display:flex;flex-direction:column;min-height:calc(100dvh - 40px)}
.dots{display:flex;gap:8px;flex:1;justify-content:center}
.dots i{width:16px;height:16px;border-radius:3px;background:#fff;border:2px solid var(--b200)}
.dots i.on{background:var(--a500);border-color:var(--a600)}
.dots.many{gap:5px}
.dots.many i{width:12px;height:12px;border-width:2px}
.prompt{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:10px 0 24px}
.say{width:124px;height:124px;font-size:56px;display:grid;place-items:center;border-radius:var(--r2)}
.say.sm{width:72px;height:72px;font-size:32px;border-radius:var(--r)}
.pic{background:#fff;border:2px solid var(--b200);border-radius:var(--r2);box-shadow:0 5px 0 var(--b200);width:min(70vw,260px);aspect-ratio:1/1;display:grid;place-items:center;font-size:min(38vw,150px);line-height:1;overflow:hidden}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding-bottom:10px}
.opt{aspect-ratio:1/1.12;font-size:clamp(56px,22vw,110px);display:grid;place-items:center;padding:0;border-radius:var(--r2);font-weight:900}
.opt.off{opacity:.2;pointer-events:none;box-shadow:none;transform:translateY(4px)}
.opt.win{--bg:var(--t600);--shade:var(--t700);animation:pop .5s}
.opt.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes pop{40%{transform:scale(1.1)}100%{transform:scale(1)}}

/* Zuordnen */
.mrow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:6px}
.mcol{display:flex;flex-direction:column;gap:10px;border-radius:var(--r2);padding:6px;border:2px solid transparent;transition:background .1s}
.mcol.over{background:var(--b100);border-color:var(--b600);border-style:dashed}
.mcol.shake{animation:shake .4s}
.mpic{border:2px solid var(--b200);background:#fff;border-radius:var(--r);box-shadow:0 4px 0 var(--b200);aspect-ratio:1/1;display:grid;place-items:center;font-size:min(20vw,84px);line-height:1;overflow:hidden;padding:0;cursor:pointer}
.mpic:active{transform:translateY(3px);box-shadow:0 1px 0 var(--b200)}
.mpic svg{width:80%;height:80%}
.mslot{aspect-ratio:1/1;border:3px dashed var(--b300);border-radius:var(--r);display:grid;place-items:center;background:rgba(255,255,255,.55)}
.mslot .mfill{--bg:var(--t600);--shade:var(--t700);width:100%;height:100%;display:grid;place-items:center;font-size:min(18vw,72px);border-radius:7px;box-shadow:none;font-weight:900}
.mletters{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:auto;padding:22px 0 10px}
.mlet{aspect-ratio:1/1;display:grid;place-items:center;font-size:min(20vw,84px);touch-action:none;cursor:grab;border-radius:var(--r2);font-weight:900}
.mlet.gone{visibility:hidden}
.mlet.drag{opacity:.3}
.mghost{position:fixed;z-index:20;pointer-events:none;transform:translate(-50%,-60%) scale(1.06);display:grid;place-items:center;border-radius:var(--r2);box-shadow:0 12px 0 var(--b700),0 18px 28px rgba(10,22,72,.3)}

/* Anmeldestatus und Willkommen */
.auth{display:flex;align-items:center;gap:8px;border-radius:10px;padding:9px 12px;margin:-6px 0 14px;font-size:14px;font-weight:800;cursor:pointer;line-height:1.2}
.auth .dot{width:10px;height:10px;border-radius:50%;flex:none}
.auth b{margin-left:auto;white-space:nowrap}
.auth.ok{background:#D9F2EF;color:#0A6B65}.auth.ok .dot{background:var(--t600)}
.auth.off{background:#FFF0C7;color:#7A5600}.auth.off .dot{background:var(--a500)}
.welcome{text-align:center;padding-top:14px}
.welcome h1{font-size:30px;margin:14px 0 6px;letter-spacing:-.02em}
.welcome .wl{color:var(--muted);font-size:16px;line-height:1.4;margin:0 0 6px}
.appicon.big{width:96px;height:96px;border-radius:22px;margin:0 auto}
.seg{display:flex;border:2px solid var(--b200);border-radius:10px;overflow:hidden;margin:16px 0 12px;background:#fff}
.seg button{flex:1;border:0;background:#fff;padding:12px;font:800 16px var(--font);color:var(--muted);cursor:pointer}
.seg button.on{background:var(--b600);color:#fff}
.welcome input[type=text]{width:100%;font:600 18px var(--font);color:var(--ink);background:#fff;border:2px solid var(--b200);border-radius:8px;padding:13px;margin-bottom:8px}
.welcome input[type=text]:focus{outline:none;border-color:var(--b600)}
.wbtn{width:100%;min-height:58px;font-size:19px;margin-top:10px;border-radius:var(--r2)}
.welcome .hint{color:var(--muted);font-size:14px;line-height:1.4;margin:10px 4px 0;font-weight:600}
.welcome .blk.c4{border:2px solid var(--b200)}

/* Sticker */
.stk{position:relative;display:grid;place-items:center;border:3px solid var(--a500);background:#fff;border-radius:var(--r2);box-shadow:0 4px 0 var(--a600);overflow:hidden;padding:0;font:inherit;color:var(--ink);cursor:pointer;aspect-ratio:1/1;isolation:isolate;--sz:44px}
.stk .se{font-size:var(--sz);line-height:1;position:relative;z-index:1}
.stk .sl{position:absolute;left:5px;top:4px;font-size:calc(var(--sz)*.3);font-weight:900;background:var(--b600);color:#fff;border-radius:4px;padding:1px 5px;line-height:1.2;z-index:2}
.stk::after{content:"";position:absolute;inset:-25%;background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.9) 50%,transparent 58%);transform:translateX(-130%);animation:sheen 3.8s ease-in-out infinite;animation-delay:var(--d,0s);pointer-events:none;z-index:3}
.stk .gl{position:absolute;color:var(--a500);font-style:normal;line-height:1;z-index:2;animation:twinkle 2.4s ease-in-out infinite;animation-delay:var(--d,0s);text-shadow:0 0 6px rgba(255,180,0,.9)}
.stk .g1{right:6px;top:4px;font-size:calc(var(--sz)*.4)}
.stk .g2{left:8px;bottom:4px;font-size:calc(var(--sz)*.28);animation-delay:calc(var(--d,0s) + 1s)}
@keyframes sheen{0%,50%{transform:translateX(-130%)}85%,100%{transform:translateX(130%)}}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.55) rotate(0)}50%{opacity:1;transform:scale(1.1) rotate(25deg)}}
.stk.empty{border:3px dashed var(--b300);background:rgba(255,255,255,.55);box-shadow:none;cursor:default}
.stk.empty::after{display:none}
.stk.empty .se{color:var(--b200);font-weight:900}
.stk.sm{--sz:30px;width:60px;flex:none}
.stk.sm .sl{display:none}
.stk.lg{--sz:60px;width:104px}
.stk.pop{animation:pop .4s}
.stkpanel{display:block;width:100%;background:#fff;border:2px solid var(--b200);border-radius:var(--r2);box-shadow:0 4px 0 var(--b200);padding:10px 12px 10px;margin:0 0 18px;cursor:pointer}
.stkpanel .sp-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;font-size:17px}
.stkpanel .sp-h span{color:var(--muted);font-size:14px}
.sp-row{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.sp-row::-webkit-scrollbar{display:none}
.agrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding-bottom:10px}
.agrid .stk{--sz:min(17vw,70px)}

/* Ergebnis */
.result{text-align:center;padding-top:26px}
.result h2{font-size:34px;margin:0 0 10px;letter-spacing:-.02em}
.bigstars{font-size:44px;letter-spacing:2px;margin:6px 0 8px;min-height:56px;line-height:1.2}
.result .sub{color:var(--muted);font-size:16px;margin:0 0 22px}
.newst{background:#fff;border:2px solid var(--b200);border-radius:var(--r2);box-shadow:0 5px 0 var(--b200);padding:16px;margin:0 0 26px}
.newst b{display:block;font-size:20px;margin-bottom:6px}
.newst .row{font-size:56px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.actions{display:flex;flex-direction:column;gap:16px}
.actions .blk{min-height:80px;font-size:25px;padding:10px 20px;display:flex;align-items:center;justify-content:center;gap:12px;border-radius:var(--r2)}
.actions .blk.c4{border:2px solid var(--b200)}

/* Karte / Einstellungen */
.ov{position:fixed;inset:0;background:rgba(10,22,72,.55);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{width:100%;max-width:520px;background:var(--paper);border-top:4px solid var(--b600);border-radius:16px 16px 0 0;padding:16px 20px calc(24px + env(safe-area-inset-bottom));max-height:94dvh;overflow:auto;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet .x{display:flex;justify-content:flex-end;margin-bottom:6px}
.sheet .x .sq{width:46px;height:46px;font-size:20px}
.cardmain{display:flex;align-items:center;justify-content:center;gap:18px;margin:4px 0 12px}
.bigl{width:min(40vw,170px);aspect-ratio:1/1;display:grid;place-items:center;font-size:min(22vw,92px);border-radius:var(--r2);box-shadow:0 6px 0 var(--shade);background:var(--bg);color:var(--fg);font-weight:900}
.emo{width:min(40vw,170px);height:min(40vw,170px);font-size:min(26vw,104px);line-height:1;display:grid;place-items:center;overflow:hidden;border:2px solid var(--b200);background:#fff;box-shadow:0 6px 0 var(--b200);padding:0;border-radius:var(--r2);cursor:pointer}
.emo svg,.pic svg{width:82%;height:82%}
.word{text-align:center;font-size:42px;margin:6px 0 4px;letter-spacing:-.02em}
.word b{color:var(--bg)}
.mdots{display:flex;gap:8px;justify-content:center;margin:8px 0 20px}
.mdots i{width:14px;height:14px;border-radius:3px;background:#fff;border:2px solid var(--b200)}
.mdots i.on{background:var(--t600);border-color:var(--t700)}
.nav{display:flex;gap:14px;justify-content:center}
.nav .blk{width:84px;height:80px;font-size:34px;display:grid;place-items:center;border-radius:var(--r2)}
.nav .blk.mid{width:120px}
.sheet h2{margin:0 0 12px;font-size:24px;letter-spacing:-.02em}
.sheet label{display:block;font-size:15px;color:var(--muted);margin:16px 0 6px}
.sheet input[type=text],.sheet textarea,.sheet select{width:100%;font:600 18px var(--font);color:var(--ink);background:#fff;border:2px solid var(--b200);border-radius:8px;padding:11px 13px}
.sheet textarea{min-height:80px;font-size:13px;word-break:break-all}
.sheet input:focus,.sheet textarea:focus,.sheet select:focus{outline:none;border-color:var(--b600)}
.sheet p{margin:0 0 8px;color:var(--muted);font-size:15px;line-height:1.4;font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.sbtn{border:0;border-radius:8px;padding:12px 16px;font:800 16px var(--font);background:var(--b600);color:#fff}
.sbtn.alt{background:var(--b100);color:var(--ink)}
.sbtn.danger{background:transparent;color:#B3261E}
.check{display:flex;align-items:center;gap:12px;font-size:17px;margin-top:14px;color:var(--ink)}
.check input{width:24px;height:24px;accent-color:var(--b600);flex:none}

#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:15px;z-index:40;max-width:90vw;text-align:center}
.pt{position:fixed;z-index:30;font-size:28px;pointer-events:none;animation:fly .9s ease-out forwards}
@keyframes fly{from{transform:translate(-50%,-50%) scale(.6);opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.2);opacity:0}}
@media (prefers-reduced-motion:reduce){
  .stk::after{display:none}.stk .gl{animation:none;opacity:.9}.stk.pop{animation:none}
  .sheet{animation:none}.opt.shake,.opt.win,.mcol.shake{animation:none}.pt{animation-duration:.01s}
  .blk{transition:none}
}
</style>
</head>
<body>
<div class="screen" id="app"></div>
<div class="ov" id="ov" hidden><div class="sheet" id="sheet"></div></div>
<div id="toast" hidden></div>

const MIN_GAP=25000,SPREAD=60000,PULL_GAP=30000;   // Sparsam: höchstens alle 60 s speichern (Server verlangt mindestens 20 s)
const lget=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lset=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const ldel=k=>{try{localStorage.removeItem(k)}catch(e){}};
const imp=u=>import(u);
const C={on:false,hash:CLOUD?(lget(ZKEY)||null):null,app:null,F:null,db:null,ref:null,timer:null,dirty:false,busy:false,lastPush:0,lastPull:0,status:'verbinde',warned:false};
const normWord=w=>String(w||'').normalize('NFKC').toLowerCase().replace(/\s+/g,'');
async function hashWord(w){
  const b=new TextEncoder().encode('buchstaben-v1:'+w);
  const d=await crypto.subtle.digest('SHA-256',b);
  return Array.from(new Uint8Array(d),x=>x.toString(16).padStart(2,'0')).join('');
}
async function loadCloud(){
  if(C.F&&C.db)return;
  const B='https://www.gstatic.com/firebasejs/10.12.2/';
  const [A,Au,F]=await Promise.all([imp(B+'firebase-app.js'),imp(B+'firebase-auth.js'),imp(B+'firebase-firestore.js')]);
  C.app=C.app||A.initializeApp(FIREBASE_CONFIG);
  await Au.signInAnonymously(Au.getAuth(C.app));
  C.F=F;C.db=F.getFirestore(C.app);
}
// Name des Kindes, Ton und Stimme bleiben auf dem Gerät. Gespeichert wird nur der Lernfortschritt.
function progDoc(inv){
  const o=JSON.parse(JSON.stringify({box:S.box,last:S.last,streak:S.streak,ws:S.ws,okw:S.okw,stk:S.stk,lw:S.lw,t:S.t||0,stars:S.stars||0}));
  o.inv=inv;o.u=C.F.serverTimestamp();
  return o;
}
function adopt(d){
  PF.forEach(k=>{if(d[k]!==undefined)S[k]=d[k]});
  ensureLeitner();
  mem=S;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
}
function cloudErr(e,m0){
  const c=(e&&e.code)||'';
  let m='Keine Verbindung. Bitte später nochmals versuchen.';
  if(c==='permission-denied')m=m0||'Zugriff verweigert. Die Firestore-Regeln fehlen oder sind nicht aktuell (siehe Anleitung).';
  else if(c==='auth/operation-not-allowed'||c==='auth/admin-restricted-operation')m='Die anonyme Anmeldung ist in Firebase nicht aktiviert.';
  toast(m,4500);
  if(window.console)console.error(e);
}
function later(ms){if(C.timer)return;C.timer=setTimeout(()=>{C.timer=null;pushNow()},ms)}
function schedulePush(){
  if(!C.on||!C.ref)return;
  C.dirty=true;
  later(Math.max(3000,C.lastPush+SPREAD-Date.now()));
}
function pushNow(){
  if(!C.on||!C.ref||!C.F||!C.dirty||C.busy)return;
  const gap=Date.now()-C.lastPush;
  if(gap<MIN_GAP){later(MIN_GAP-gap+500);return}
  C.busy=true;C.dirty=false;C.lastPush=Date.now();
  C.F.runTransaction(C.db,async tx=>{
    const s=await tx.get(C.ref),d=s.exists()?s.data():null;
    if(d&&(d.t||0)>(S.t||0))return d;     // anderes Gerät ist weiter: nichts überschreiben
    tx.set(C.ref,progDoc(d?d.inv:''));return null;
  }).then(d=>{C.busy=false;if(d){adopt(d);if(view!=='game')render()}C.status='verbunden';refreshAuth()})
    .catch(e=>{C.busy=false;C.dirty=true;C.status='offline';refreshAuth();
      if(e&&e.code==='permission-denied'&&!C.warned){C.warned=true;cloudErr(e)}
      later(SPREAD)});
}
// Stand vom Server holen (beim Start und beim Zurückkehren in die App), kein Dauer-Abgleich
async function pull(){
  if(!C.on||!C.ref||!C.F)return;
  if(Date.now()-C.lastPull<PULL_GAP)return;
  C.lastPull=Date.now();
  try{
    const s=await C.F.getDocFromServer(C.ref);
    C.status='verbunden';refreshAuth();
    if(!s.exists())return;
    const d=s.data(),rt=d.t||0,lt=S.t||0;
    if(rt>lt){adopt(d);if(view!=='game')render()}
    else if(lt>rt){C.dirty=true;pushNow()}
  }catch(e){C.status='offline';refreshAuth()}
}
function reconnect(){
  if(!CLOUD||!C.hash)return;
  C.on=true;
  loadCloud().then(()=>{C.ref=C.F.doc(C.db,'kids',C.hash);C.lastPull=0;return pull()}).catch(()=>{C.status='offline'});
}
function connect(h,raw,justWrote){
  C.hash=h;lset(ZKEY,h);
  const w=normWord(raw);
  lset(ZHINT,w.charAt(0)+'•'.repeat(Math.max(2,w.length-1))+' ('+w.length+' Zeichen)');
  C.ref=C.F.doc(C.db,'kids',h);C.on=true;C.status='verbunden';C.lastPull=Date.now();
  C.lastPush=justWrote?Date.now():0;
}
function wordOk(){
  const raw=($('#pWord')||{}).value||'',w=normWord(raw);
  if(w.length<6){toast('Das Zauberwort braucht mindestens 6 Zeichen');return null}
  if(!(window.crypto&&crypto.subtle)){toast('Dieses Gerät unterstützt das leider nicht');return null}
  return {raw,w};
}
async function zwNew(){
  const o=wordOk();if(!o)return;
  const inv=String(($('#pInv')||{}).value||'').trim().toLowerCase();
  if(!inv){toast('Bitte den Einladungscode eingeben');return}
  toast('Einen Moment …');
  try{
    await loadCloud();
    const h=await hashWord(o.w),F=C.F,ref=F.doc(C.db,'kids',h);
    const made=await F.runTransaction(C.db,async tx=>{
      const s=await tx.get(ref);if(s.exists())return false;
      tx.set(ref,progDoc(inv));return true;
    });
    if(!made){toast('Dieses Zauberwort gibt es schon. Nimm ein anderes.',3500);return}
    connect(h,o.raw,true);afterAuth();toast('Zauberwort angelegt. Gut merken!',3500);
  }catch(e){cloudErr(e,'Der Einladungscode stimmt nicht (oder die Firestore-Regeln fehlen noch).')}
}
async function zwLogin(){
  const o=wordOk();if(!o)return;
  toast('Einen Moment …');
  try{
    await loadCloud();
    const h=await hashWord(o.w),F=C.F;
    const snap=await F.getDocFromServer(F.doc(C.db,'kids',h));
    if(!snap.exists()){toast('Dieses Zauberwort gibt es nicht',3000);return}
    const d=snap.data();
    if((S.t||0)>0&&(S.t||0)!==(d.t||0)&&!confirm(`Auf diesem Gerät gibt es schon Fortschritt (${S.t} Fragen, gespeichert: ${d.t||0}). Mit dem gespeicherten Fortschritt ersetzen?`))return;
    adopt(d);connect(h,o.raw,false);afterAuth();toast('Angemeldet');
  }catch(e){cloudErr(e)}
}
function zwOut(){

  clearTimeout(C.timer);C.timer=null;C.on=false;C.hash=null;C.ref=null;C.dirty=false;ldel(ZKEY);ldel(ZHINT);

function persist(){mem=S;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(C.on)schedulePush()}

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

// Sprache und Töne
let voice=null;
function pickVoice(){
  if(!('speechSynthesis' in window))return;
  const vs=speechSynthesis.getVoices().map(v=>({v,lang:(v.lang||'').replace('_','-')}));
  const f=fn=>{const m=vs.find(fn);return m?m.v:null};
  const pref=S.voiceName?vs.find(x=>x.v.name===S.voiceName):null;
  if(pref){voice=pref.v;return}
  voice=f(x=>x.lang==='de-CH')||f(x=>x.lang==='de-DE'&&/anna|petra|helena|yannick|markus|katja/i.test(x.v.name))||f(x=>x.lang==='de-DE')||f(x=>x.lang.indexOf('de')===0)||null;
}
if('speechSynthesis' in window){pickVoice();speechSynthesis.addEventListener&&speechSynthesis.addEventListener('voiceschanged',pickVoice)}
function speak(t){
  if(!S.sound||!('speechSynthesis' in window))return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t);
    u.lang=voice?voice.lang:'de-DE';if(voice)u.voice=voice;
    u.rate=S.rate||.85;u.pitch=1.08;
    speechSynthesis.speak(u);
  }catch(e){}
}
let ac=null;
function tone(freqs,dur){
  if(!S.sound)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    let t=ac.currentTime;
    freqs.forEach(f=>{
      const o=ac.createOscillator(),g=ac.createGain();
      o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur+.02);t+=dur*.8;
    });
  }catch(e){}
}
const chime=()=>tone([660,880,1100],.16);
const soft=()=>tone([300],.2);

function toast(m,ms){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,ms||2400)}
function burst(el,chars){
  if(!el)return;
  const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  for(let i=0;i<10;i++){
    const s=document.createElement('span');s.className='pt';s.textContent=chars[i%chars.length];
    const a=Math.random()*6.28,d=60+Math.random()*90;
    s.style.cssText=`left:${cx}px;top:${cy}px;--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d-40}px`;
    document.body.appendChild(s);setTimeout(()=>s.remove(),1000);
  }
}

// Welche Buchstaben sind dran?
function nameLetters(){
  const m=(S.name||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().match(/[A-Z]/g)||[];
  return Array.from(new Set(m));
}
// ===== Leitner: Boxen 1-5, Abstände in Fragen =====
const CAP=7;                       // höchstens so viele Buchstaben in Box 1+2, bevor ein neuer dazukommt
const INT=[0,7,14,28,56,112];      // Abstand je Box = CAP x 1, 2, 4, 8, 16
const NEEDW=3;                     // ab Box 4: mindestens so viele verschiedene Wörter richtig
function nextNew(picOnly,exclude){
  const c=nameLetters().concat(ORDER);
  for(const l of c){if(LET[l]&&!S.box[l]&&!(exclude&&exclude.has(l))&&(!picOnly||LET[l].pic))return l}
  return null;
}
function ensureLeitner(){
  S.last=S.last||{};S.streak=S.streak||{};S.ws=S.ws||{};S.okw=S.okw||{};S.stk=S.stk||{};S.lw=S.lw||{};S.t=S.t||0;
  if(S.box)return;
  S.box={};
  const legacy=Object.keys(S.ok||{}).length>0;
  if(legacy){
    // Übernahme aus der alten Zählung: 0 Treffer = Box 1, 1-2 = Box 2, 3+ = Box 3
    const done=ALL.filter(x=>(S.ok[x.l]||0)>=3).length;
    const set=ORDER.slice(0,Math.min(26,6+done));
    nameLetters().forEach(c=>{if(set.indexOf(c)<0)set.push(c)});
    ALL.forEach(x=>{if((S.ok[x.l]||0)>0&&set.indexOf(x.l)<0)set.push(x.l)});
    set.forEach(l=>{const n=S.ok[l]||0;S.box[l]=n>=3?3:n>=1?2:1;if(n>=3)S.stk[l]=true});
  }else{
    let n=0,l;
    while(n<CAP&&(l=nextNew(false))){S.box[l]=1;n++}
  }
  persist();
}
const unlocked=()=>ALL.filter(x=>S.box[x.l]).map(x=>x.l);
const activeCount=()=>ALL.filter(x=>S.box[x.l]===1||S.box[x.l]===2).length;
const ratioOf=l=>S.last[l]===undefined?Infinity:(S.t-S.last[l])/INT[S.box[l]];
function selectLetter(picOnly,exclude){
  const un=unlocked().filter(l=>!exclude.has(l)&&(!picOnly||LET[l].pic));
  const rt={};let mx=0;
  un.forEach(l=>{rt[l]=ratioOf(l);if(rt[l]>mx)mx=rt[l]});
  const nn=nextNew(picOnly,exclude);
  if(nn&&activeCount()<CAP&&(!un.length||mx<2)){S.box[nn]=1;return nn}
  if(!un.length){
    const any=ALL.filter(x=>!exclude.has(x.l)&&(!picOnly||x.pic)).map(x=>x.l);
    const f=any[Math.floor(Math.random()*any.length)];
    if(!S.box[f])S.box[f]=1;
    return f;
  }
  un.sort((a,b)=>((rt[b]-rt[a])||0)||(S.box[a]-S.box[b])||(Math.random()-.5));
  return un[0];
}
// Wort mit den wenigsten Auftritten, nie zweimal hintereinander dasselbe
function pickWord(l){
  const n=LET[l].words.length;
  const ws=(S.ws[l]||[]).slice(0,n);while(ws.length<n)ws.push(0);
  let c=[];for(let i=0;i<n;i++)if(n===1||i!==S.lw[l])c.push(i);
  const mn=Math.min.apply(null,c.map(i=>ws[i]));
  c=c.filter(i=>ws[i]===mn);
  const i=c[Math.floor(Math.random()*c.length)];
  ws[i]++;S.ws[l]=ws;S.lw[l]=i;
  return i;
}
// Auswertung des ersten Versuchs. Gibt true zurück, wenn ein neuer Sticker verdient wurde.
function grade(l,wi,ok){
  const b=S.box[l]||1,n=LET[l].words.length;
  const ratio=ratioOf(l);
  let sticker=false;
  if(ok){
    const a=S.okw[l]=S.okw[l]||[];if(a.indexOf(wi)<0)a.push(wi);
    S.streak[l]=(S.streak[l]||0)+1;
    const need=b<=1?1:2;
    if(ratio>=.5&&S.streak[l]>=need){
      S.streak[l]=0;
      let nb=Math.min(5,b+1);
      if(nb>=4&&a.length<Math.min(NEEDW,n))nb=b;
      S.box[l]=nb;
      if(nb>=3&&!S.stk[l]){S.stk[l]=S.t+1;sticker=true}
    }
  }else{
    S.streak[l]=0;if(b>1)S.box[l]=b-1;
  }
  S.last[l]=S.t;S.t++;
  return sticker;
}

// Spiel
function startGame(mode){
  const m=mode==='match';
  G={mode,i:0,right:0,stickers:[],q:null,last:null,total:m?5:ROUND,max:m?15:ROUND};
  if(m)nextSet();else nextQ();
}
function nextQ(){
  if(G.i>=G.total){
    view='result';render();pushNow();
    speak(G.right?`Fertig! ${G.right} ${G.right===1?'Stern':'Sterne'}.`:'Fertig! Gut geübt.');
    return;
  }
  const t=selectLetter(G.mode!=='hear',new Set(G.last?[G.last]:[]));G.last=t;
  const wi=pickWord(t),word=LET[t].words[wi];
  // keine Antwortmöglichkeit, die dasselbe Bild ebenfalls hätte (Mandarine/Orange)
  const pool0=shuffle(unlocked().filter(l=>l!==t));
  const clean=pool0.filter(l=>!LET[l].words.some(x=>x.e===word.e));
  const others=clean.concat(pool0.filter(l=>clean.indexOf(l)<0)).slice(0,2);
  G.q={t,wi,word,opts:shuffle([t,...others]),tries:0,done:false};
  view='game';render();
  setTimeout(promptQ,250);
}
function promptQ(){
  if(!G||!G.q)return;
  const t=LET[G.q.t];
  const wd=G.q.word.w;
  speak(G.mode==='hear'?`Wo ist das ${t.n} wie ${wd}?`:(G.i===0&&!G.q.asked?`${wd}. Mit welchem Buchstaben fängt das an?`:wd));
  G.q.asked=true;
}
function pick(btn){
  const q=G&&G.q;if(!q||q.done)return;
  const l=btn.dataset.l,t=LET[q.t];
  if(l===q.t){
    q.done=true;btn.classList.add('win');
    let chars=['⭐'];
    if(q.tries===0){
      S.stars++;G.right++;
      if(grade(q.t,q.wi,true)){G.stickers.push(q.t);chars=[t.ce,'⭐']}
    }
    persist();chime();burst(btn,chars);
    const extra=chars.length>1?' Neuer Sticker!':'';
    speak(`${PRAISE[Math.floor(Math.random()*PRAISE.length)]} ${t.n} wie ${q.word.w}.${extra}`);
    const star=$('.stars');if(star)star.textContent='⭐ '+G.right;
    const dots=document.querySelectorAll('.dots i');if(dots[G.i])dots[G.i].classList.add('on');
    setTimeout(()=>{G.i++;nextQ()},chars.length>1?3400:2600);
  }else{
    if(q.tries===0){grade(q.t,q.wi,false);persist()}
    q.tries++;btn.classList.add('shake','off');soft();
    speak('Fast! Probier nochmal.');
  }
}

// Zuordnen: Buchstaben auf Bilder ziehen
let md=null,noTap=0;
function matchHtml(){
  const m=G.m;
  const dots=Array.from({length:G.total},(_,i)=>`<i class="${i<G.i?'on':''}"></i>`).join('');
  return `<div class="game"><div class="top">${backBtn()}<div class="dots${G.total>6?' many':''}">${dots}</div>${starsPill(G.right)}</div>
  <div class="mrow">${m.pics.map(it=>`<div class="mcol" data-t="${it.l}"><button class="mpic" data-a="mpic" aria-label="${esc(it.word.w)}">${vis(it.word)}</button><div class="mslot">${m.done.has(it.l)?`<div class="blk c0 mfill">${it.l}</div>`:''}</div></div>`).join('')}</div>
  <div class="mletters">${m.lets.map(it=>`<div class="blk mlet c0${m.done.has(it.l)?' gone':''}" data-l="${it.l}" aria-label="Buchstabe ${it.l}">${it.l}</div>`).join('')}</div></div>`;
}
function nextSet(){
  if(G.i>=G.total){
    view='result';render();pushNow();
    speak(G.right?`Fertig! ${G.right} ${G.right===1?'Stern':'Sterne'}.`:'Fertig! Gut geübt.');
    return;
  }
  const items=[],ex=new Set();
  const same=(a,b)=>LET[a.l].words.some(x=>x.e===b.word.e)||LET[b.l].words.some(x=>x.e===a.word.e);
  for(let i=0;i<3;i++){
    let it=null,tries=0;
    while(tries++<8){
      const l=selectLetter(true,ex),wi=pickWord(l);
      it={l,wi,word:LET[l].words[wi]};
      if(!items.some(o=>same(o,it)))break;   // zwei Bilder, die zu beiden Buchstaben passen würden: neu wählen
      ex.add(l);
    }
    ex.add(it.l);items.push(it);
  }
  const lets=shuffle(items);let pics=shuffle(items),n=0;
  while(n++<6&&pics.every((x,i)=>x===lets[i]))pics=shuffle(items);
  G.m={items,lets,pics,done:new Set(),tried:new Set()};
  view='game';render();
  if(G.i===0)setTimeout(()=>speak('Zieh jeden Buchstaben zum passenden Bild.'),250);
}
function dropOn(col,tile){
  const m=G.m,l=tile.dataset.l,t=col.dataset.t;
  if(m.done.has(t))return;
  if(l===t){
    m.done.add(l);tile.classList.add('gone');
    const slot=col.querySelector('.mslot');
    slot.innerHTML=`<div class="blk c0 mfill">${l}</div>`;
    let chars=['⭐'];
    if(!m.tried.has(l)){
      S.stars++;G.right++;
      const itx=m.items.find(x=>x.l===l);
      if(grade(l,itx.wi,true)){G.stickers.push(l);chars=[LET[l].ce,'⭐']}
    }
    persist();chime();burst(slot,chars);
    const star=$('.stars');if(star)star.textContent='⭐ '+G.right;
    const it=m.items.find(x=>x.l===l);
    speak(`${LET[l].n} wie ${it.word.w}.${chars.length>1?' Neuer Sticker!':''}`);
    if(m.done.size===m.items.length){
      const dots=document.querySelectorAll('.dots i');if(dots[G.i])dots[G.i].classList.add('on');
      setTimeout(()=>{G.i++;nextSet()},3200);
    }
  }else{
    if(!m.tried.has(l)){grade(l,0,false);persist()}
    m.tried.add(l);soft();col.classList.add('shake');
    setTimeout(()=>col.classList.remove('shake'),450);
    speak('Fast! Probier nochmal.');
  }
}
function colAt(x,y){const el=document.elementFromPoint(x,y);return el&&el.closest?el.closest('.mcol'):null}
function clearOverM(){document.querySelectorAll('.mcol.over').forEach(e=>e.classList.remove('over'))}
function endMDrag(){
  if(!md)return;
  if(md.ghost)md.ghost.remove();
  md.el.classList.remove('drag');clearOverM();
}
document.addEventListener('pointerdown',ev=>{
  if(md||view!=='game'||!G||G.mode!=='match')return;
  const el=ev.target.closest&&ev.target.closest('.mlet');
  if(!el||el.classList.contains('gone'))return;
  md={el,x:ev.clientX,y:ev.clientY,drag:false,ghost:null};
});
document.addEventListener('pointermove',ev=>{
  if(!md)return;
  if(!md.drag){
    if(Math.hypot(ev.clientX-md.x,ev.clientY-md.y)<8)return;
    const r=md.el.getBoundingClientRect(),g=document.createElement('div');
    g.className='blk c0 mghost';g.textContent=md.el.dataset.l;
    g.style.width=r.width+'px';g.style.height=r.height+'px';g.style.fontSize=getComputedStyle(md.el).fontSize;
    document.body.appendChild(g);md.ghost=g;md.drag=true;md.el.classList.add('drag');
  }
  md.ghost.style.left=ev.clientX+'px';md.ghost.style.top=ev.clientY+'px';
  clearOverM();
  const c=colAt(ev.clientX,ev.clientY);
  if(c&&!G.m.done.has(c.dataset.t))c.classList.add('over');
});
document.addEventListener('pointerup',ev=>{
  if(!md)return;
  const d=md;
  if(!d.drag){md=null;return}
  endMDrag();md=null;noTap=Date.now()+350;
  const c=colAt(ev.clientX,ev.clientY);
  if(c)dropOn(c,d.el);
});
document.addEventListener('pointercancel',()=>{if(md){endMDrag();md=null}});

  if(ev.target.id==='pVoice'){S.voiceName=ev.target.value;persist();pickVoice();speak('Ämm wie Maus')}
  if(ev.target.id==='pRate'){S.rate=parseFloat(ev.target.value)||.85;persist();speak('Ämm wie Maus')}
  if(ev.target.id==='pSound'){S.sound=ev.target.checked;persist();if(!S.sound&&'speechSynthesis' in window)speechSynthesis.cancel()}
});

render();
if(C.hash)reconnect();
})();
</script>
