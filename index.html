const sameItem=(a,b)=>LET[a.l].words.some(x=>x.e===b.word.e)||LET[b.l].words.some(x=>x.e===a.word.e);
// Die Buchstaben eines Durchgangs mit (neuen) Wörtern, ohne verwechselbare Bilder
function itemsFor(letters){
  const items=[];
  letters.forEach(l=>{
    let it=null,tries=0;
    while(tries++<8){
      const wi=pickWord(l);it={l,wi,word:LET[l].words[wi]};
      if(!items.some(o=>sameItem(o,it)))break;
    }
    items.push(it);
  });
  return items;
}
function nextSet(){
  // Durchgänge, die nicht ganz geklappt haben, kommen am Ende einmal nochmals dran
  if(G.i>=G.main&&!G.xsets){G.xsets=G.fsets.slice();G.total=G.main+G.xsets.length}
  if(G.i>=G.total){finishRound();return}
  const extra=G.i>=G.main;
  let items,pcs=[];
  if(extra){const fs=G.xsets[G.i-G.main];items=itemsFor(shuffle(fs.letters));pcs=fs.pcs}
  else{
    items=[];const ex=new Set(),cnt=G.sizes[G.i];
    for(let i=0;i<cnt;i++){
      let it=null,tries=0;
      while(tries++<8){
        const l=selectLetter(true,ex),wi=pickWord(l);
        it={l,wi,word:LET[l].words[wi]};
        if(!items.some(o=>sameItem(o,it)))break;   // zwei Bilder, die zu beiden Buchstaben passen würden: neu wählen
        ex.add(l);
      }
      ex.add(it.l);items.push(it);G.played.push(it.l);
    }
  }
  const lets=shuffle(items);let pics=shuffle(items),n=0;
  while(n++<6&&pics.every((x,i)=>x===lets[i]))pics=shuffle(items);
  G.m={items,lets,pics,done:new Set(),tried:new Set(),extra,pcs,pn:extra?pcs.length:G.pieces[G.i]};
  view='game';render();
  if(G.i===0)setTimeout(()=>speak('Zieh jeden Buchstaben zum passenden Bild.'),250);
  else if(extra&&G.i===G.main)setTimeout(()=>speak('Noch einmal üben!'),250);
}
// Teile gibt es nur, wenn alle Buchstaben des Durchgangs gleich beim ersten Mal stimmten.
// Sonst werden sie orange und lassen sich in der Wiederholung am Ende grün machen.
function dropOn(col,tile){
  const m=G.m,l=tile.dataset.l,t=col.dataset.t;
  if(m.done.has(t))return;
  if(l===t){
    m.done.add(l);tile.classList.add('gone');
    const slot=col.querySelector('.mslot');
    slot.innerHTML=`<div class="blk c0 mfill">${l}</div>`;
    let chars=[];
    const it=m.items.find(x=>x.l===l);
    if(!m.extra&&!m.tried.has(l)){
      G.right++;chars=['✨'];
      if(grade(l,it.wi,true)){G.stickers.push(l);chars=[LET[l].ce,'✨']}
    }
    persist();chime();if(chars.length)burst(slot,chars);
    speak(`${LET[l].n} wie ${it.word.w}.${chars.length>1?' Neuer Sticker!':''}`);
    if(m.done.size===m.items.length){
      const ok=m.tried.size===0;
      if(m.extra){
        if(ok)setTimeout(()=>winPieces(m.pcs),500);else releasePieces(m.pcs);
      }else if(ok){
        setTimeout(()=>revealPieces(m.pn),500);
      }else{
        const pk=markPieces(m.pn);
        G.fsets.push({letters:m.items.map(x=>x.l),pcs:pk});
      }
      const dots=document.querySelectorAll('.dots i');if(dots[G.i])dots[G.i].classList.add('on');
      setTimeout(()=>{if(!G||G.m!==m)return;G.i++;nextSet()},3600);
    }
  }else{
    if(!m.extra&&!m.tried.has(l)){grade(l,0,false);persist()}
    m.tried.add(l);soft();col.classList.add('shake');
    setTimeout(()=>col.classList.remove('shake'),450);
    speak('Fast! Probier nochmal.');
  }
}
function colAt(x,y){const el=document.elementFromPoint(x,y);return el&&el.closest?el.closest('.mcol'):null}
function slotAt(x,y){const el=document.elementFromPoint(x,y);return el&&el.closest?el.closest('.oslot'):null}
function trayAt(x,y){const el=document.elementFromPoint(x,y);return el&&el.closest?el.closest('.otiles'):null}
function clearOverM(){document.querySelectorAll('.mcol.over,.oslot.over,.otiles.over').forEach(e=>e.classList.remove('over'))}
function endMDrag(){
  if(!md)return;
  if(md.ghost)md.ghost.remove();
  md.el.classList.remove('drag');clearOverM();
}
document.addEventListener('pointerdown',ev=>{
  if(md||view!=='game'||!G)return;
  const sel=G.mode==='match'?'.mlet':G.mode==='ord'?'.otile':null;
  if(!sel)return;
  if(G.mode==='ord'&&(!G.o||G.o.done))return;
  const el=ev.target.closest&&ev.target.closest(sel);
  if(!el||el.classList.contains('gone')||el.classList.contains('static'))return;
  md={el,x:ev.clientX,y:ev.clientY,drag:false,ghost:null,kind:G.mode};
});
document.addEventListener('pointermove',ev=>{
  if(!md)return;
  if(!md.drag){
    if(Math.hypot(ev.clientX-md.x,ev.clientY-md.y)<8)return;
    const r=md.el.getBoundingClientRect(),g=document.createElement('div');
    g.className=(md.kind==='ord'?'blk c2':'blk c0')+' mghost';g.textContent=md.el.dataset.l||md.el.dataset.n;
    g.style.width=r.width+'px';g.style.height=r.height+'px';g.style.fontSize=getComputedStyle(md.el).fontSize;
    document.body.appendChild(g);md.ghost=g;md.drag=true;md.el.classList.add('drag');
  }
  md.ghost.style.left=ev.clientX+'px';md.ghost.style.top=ev.clientY+'px';
  clearOverM();
  if(md.kind==='ord'){
    const s=slotAt(ev.clientX,ev.clientY);
    if(s)s.classList.add('over');
    else if(md.el.classList.contains('inslot')){const t=trayAt(ev.clientX,ev.clientY);if(t)t.classList.add('over')}
  }else{
    const c=colAt(ev.clientX,ev.clientY);
    if(c&&!G.m.done.has(c.dataset.t))c.classList.add('over');
  }
});
document.addEventListener('pointerup',ev=>{
  if(!md)return;
  const d=md;
  if(!d.drag){md=null;return}
  endMDrag();md=null;noTap=Date.now()+350;
  if(d.kind==='ord'){const s=slotAt(ev.clientX,ev.clientY)||trayAt(ev.clientX,ev.clientY);if(s)ordDrop(s,d.el)}
  else{const c=colAt(ev.clientX,ev.clientY);if(c)dropOn(c,d.el)}
});
document.addEventListener('pointercancel',()=>{if(md){endMDrag();md=null}});

    if(!confirm('Den Fortschritt auf diesem Gerät durch die Sicherung ersetzen?'))return;
    S=Object.assign({name:'',pz:{a:0,m:0},sound:true,rate:.85,voiceName:'',ok:{}},o);ensureLeitner();pickVoice();persist();toast('Sicherung eingespielt');drawParent();
  }catch(e){toast('Dieser Code funktioniert nicht')}
}

// Ereignisse
let lp=false,lpT=null;
document.addEventListener('pointerdown',ev=>{
  const g=ev.target.closest&&ev.target.closest('[data-a=gear]');
  if(g){lp=false;clearTimeout(lpT);lpT=setTimeout(()=>{lp=true;drawParent()},700)}
});
['pointerup','pointercancel','pointerleave'].forEach(e=>document.addEventListener(e,()=>clearTimeout(lpT)));

document.addEventListener('click',ev=>{
  if(ev.target.id==='ov'){closeOv();return}
  const t=ev.target.closest('[data-a]');if(!t)return;
  const a=t.dataset.a;
  if(a==='gear'){if(lp){lp=false;return}toast('Zum Öffnen gedrückt halten');return}
  switch(a){
    case 'home':if('speechSynthesis' in window)speechSynthesis.cancel();G=null;go('home');break;
    case 'menu':if('speechSynthesis' in window)speechSynthesis.cancel();G=null;go(world==='numbers'?'numbers':'letters');break;
    case 'world':world=t.dataset.w==='numbers'?'numbers':'letters';go(world);break;
    case 'zoo':world='letters';go('zoo');setTimeout(zFocus,40);break;
    case 'zoomove':if(G&&G.newAnimal!==undefined)enterZoo(G.newAnimal);break;
    case 'zt':{const an=ANIMALS[+t.dataset.i];if(an&&!ZMOVE){speak(an.n);const z=t.querySelector('.zi');if(z){z.classList.remove('jump');void z.offsetWidth;z.classList.add('jump')}}break}
    case 'authinfo':toast(`Angemeldet mit ${lget(ZHINT)||'Zauberwort'}. Der Fortschritt wird nach jeder Runde gespeichert. Zum Ändern: Zahnrad gedrückt halten.`,5000);break;
    case 'authlogin':drawLogin();break;
    case 'wmode':{const v=($('#pWord')||{}).value||'';welcomeMode=t.dataset.m==='new'?'new':'login';render();if(v&&$('#pWord'))$('#pWord').value=v;break}
    case 'wskip':lset(SKIPKEY,'1');view='home';render();break;
    case 'discover':world='letters';go('discover');break;
    case 'album':world='letters';go('album');break;
    case 'stk':{const x=LET[t.dataset.l];speak(`${x.n} wie ${x.w}`);t.classList.remove('pop');void t.offsetWidth;t.classList.add('pop');break}
    case 'play-hear':startGame('hear');break;
    case 'play-pic':startGame('pic');break;
    case 'play-match':startGame('match');break;
    case 'play-nhear':startGame('nhear');break;
    case 'play-ord':startGame('ord');break;
    case 'play-rrow':startGame('rrow');break;
    case 'rpick':rPick(t);break;
    case 'rnum':{const n=+t.dataset.n;if(n)speak(NW[n-1]);break}
    case 'otile':{const n=+t.dataset.n;if(n)speak(NW[n-1]);break}
    case 'mpic':{const it=G&&G.m&&G.m.items.find(x=>x.l===t.closest('.mcol').dataset.t);if(it)speak(it.word.w);break}
    case 'again-round':startGame(G.mode,G.mode==='syl'?G.st:G.lv);break;
    case 'syl-menu':world='letters';go('syl');break;
    case 'syl-play':startGame('syl',+t.dataset.st||1);break;
    case 'smenu':if('speechSynthesis' in window)speechSynthesis.cancel();G=null;go('syl');break;
    case 'ylock':{t.classList.remove('shake');void t.offsetWidth;t.classList.add('shake');speak('Das ist ein Bonus. Sammle zuerst alle Sticker und alle Tiere.');toast(t.dataset.st?'Zuerst die Stufe davor schaffen':'Bonus: öffnet sich mit allen 26 Stickern und allen 15 Tieren',3500);break}
    case 'again':promptQ();break;
    case 'pick':if(G&&G.mode==='syl')pickSY(t);else if(G&&G.mode==='nhear')pickNH(t);else if(G&&G.mode==='dice')pickD(t);else pick(t);break;
    case 'play-dice':world='numbers';go('dice');break;
    case 'dice-play':startGame('dice',+t.dataset.lv||1);break;
    case 'dmenu':if('speechSynthesis' in window)speechSynthesis.cancel();G=null;go('dice');break;
    case 'dlock':{t.classList.remove('shake');void t.offsetWidth;t.classList.add('shake');const lv=+t.dataset.lv;speak('Noch gesperrt. Übe zuerst mit weniger Würfeln.');toast(`Zuerst mit ${lv-1} ${lv-1===1?'Würfel':'Würfeln'} üben: 8 von 10 richtig schaltet frei (mindestens ${DMIN} Würfe)`,3500);break}
    case 'droll':diceTap();break;
    case 'card':openCard(t.dataset.l);break;
    case 'say':speakCard();break;
    case 'nextword':nextWord();break;
    case 'prev':stepCard(-1);break;
    case 'next':stepCard(1);break;
    case 'close':closeOv();break;
    case 'copyCode':{
      const v=$('#pCode').value;
      (navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast('Code kopiert')).catch(()=>{$('#pCode').select();document.execCommand('copy');toast('Code kopiert')});
      break}
    case 'importCode':importCode();break;
    case 'testVoice':speak('Ämm wie Maus');break;
    case 'zwNew':zwNew();break;
    case 'zwLogin':zwLogin();break;
    case 'zwOut':zwOut();break;
    case 'zwSync':C.dirty=true;pushNow();toast('Wird gespeichert');break;
    case 'ptab':ptab=t.dataset.t==='numbers'?'numbers':'letters';drawPTab();break;
    case 'resetL':
      if(confirm(C.hash?'Den Fortschritt bei den Buchstaben zurücksetzen (alle Boxen, Sticker und Tiere)? Auch der online gespeicherte Fortschritt wird zurückgesetzt. Die Zahlen bleiben.':'Den Fortschritt bei den Buchstaben zurücksetzen (alle Boxen, Sticker und Tiere)? Die Zahlen bleiben.')){
        resetLetters();toast('Buchstaben zurückgesetzt');drawParent();render();
      }
      break;
    case 'resetN':
      if(confirm(C.hash?'Den Fortschritt bei den Zahlen zurücksetzen? Auch der online gespeicherte Fortschritt wird zurückgesetzt. Die Buchstaben bleiben.':'Den Fortschritt bei den Zahlen zurücksetzen? Die Buchstaben bleiben.')){
        resetNumbers();toast('Zahlen zurückgesetzt');drawParent();render();
      }
      break;
  }
});
document.addEventListener('input',ev=>{
  if(ev.target.id==='pName'){S.name=ev.target.value.trim();persist()}
});
document.addEventListener('change',ev=>{
  if(ev.target.id==='pVoice'){S.voiceName=ev.target.value;persist();pickVoice();speak('Ämm wie Maus')}
  if(ev.target.id==='pRate'){S.rate=parseFloat(ev.target.value)||.85;persist();speak('Ämm wie Maus')}
  if(ev.target.id==='pSound'){S.sound=ev.target.checked;persist();if(!S.sound&&'speechSynthesis' in window)speechSynthesis.cancel()}
});

// ===== Spielzeit =====
// Jede Sekunde in einem Spiel (Spielansicht, Ergebnis oder «Entdecken») wird zur Gesamtzeit gezählt, aber nur, wenn die App sichtbar ist
// und in den letzten 60 Sekunden etwas angetippt wurde. Zoo, Album und Menüs zählen nicht. Angezeigt wird eine einzige Summe über alle Spiele.
const IDLE_MS=60000;
let lastAct=Date.now(),tmTicks=0;
['pointerdown','keydown'].forEach(e=>document.addEventListener(e,()=>{lastAct=Date.now()},true));
function playing(){
  if(document.hidden)return false;
  return view==='discover'||((view==='game'||view==='result')&&!!G&&!!G.mode);
}
function tmTick(){
  if(!playing())return;
  if(Date.now()-lastAct>IDLE_MS)return;
  S.tt=(S.tt||0)+1;
  if(++tmTicks%15===0)persist();
}
setInterval(tmTick,1000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)persist()});
function fmtTime(sec){
  sec=Math.round(sec||0);
  if(sec<=0)return '0 Min';
  const m=Math.round(sec/60);
  if(m<1)return '<1 Min';
  const h=Math.floor(m/60);
  return h>0?`${h} Std ${m%60} Min`:`${m} Min`;
}
const timeLine=()=>`Spielzeit insgesamt: <b>${fmtTime(S.tt)}</b>`;

render();
if(C.hash)reconnect();
})();
</script>
